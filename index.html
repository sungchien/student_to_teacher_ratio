<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>優久大學聯盟成員學校生師比統計</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            background-color: #FFFFF0; 
            color: #111111; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        #header { 
            height: 15vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            font-weight: bold; 
            border-bottom: 1px solid #ccc; 
        }
        #main { 
            height: 85vh; 
            display: flex; 
            flex-direction: row; 
        }
        #left-panel, #right-panel { 
            width: 50%; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
        }
        #left-panel { 
            border-right: 1px solid #ccc; 
        }
        .chart-title { 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 18px;
        }
        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 10px; 
        }
        #bcr-container, #line-container { 
            flex-grow: 1; 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        select, button { 
            font-size: 16px; 
            padding: 5px; 
        }
        .year-label { 
            font-size: 48px; 
            font-weight: bold; 
            fill: #ccc; 
            text-anchor: end; 
        }
        .axis path, .axis line { 
            stroke: #111111; 
        }
        .axis text { 
            fill: #111111; 
            font-size: 12px; 
        }
    </style>
</head>
<body>
    <div id="header">優久大學聯盟成員學校生師比統計</div>
    <div id="main">
        <div id="left-panel">
            <div class="chart-title">各校生師比動態排名</div>
            <div id="bcr-container"></div>
        </div>
        <div id="right-panel">
            <div class="chart-title">個別大學歷年生師比趨勢</div>
            <div class="controls">
                <label for="uni-select">選擇大學：</label>
                <select id="uni-select"><option value="all">-- 顯示所有大學 --</option></select>
                <button id="reset-btn">Reset</button>
            </div>
            <div id="line-container"></div>
        </div>
    </div>
    <script>
        // 1. 定義顏色對應表 (指定之 Hex 色碼)
        const colorMap = {
            "東吳大學": "#E53935",
            "中國文化大學": "#FFD700",
            "世新大學": "#8C0B2F",
            "淡江大學": "#DB1921",
            "銘傳大學": "#003574",
            "輔仁大學": "#FFE100",
            "實踐大學": "#269C3D",
            "大同大學": "#90EE90",
            "台北醫學大學": "#8F2827",
            "中原大學": "#002D62",
            "逢甲大學": "#7D212A",
            "靜宜大學": "#6ABBBB",
            "東海大學": "#005AB5"
        };

        let data = [];
        let years = [];
        let currentYearIndex = 0;
        let ticker;
        const tickDuration = 1000;
        
        // 2. 讀取外部 CSV 檔案
        d3.csv("student_teacher_ratio.csv").then(function(rawData) {
            // 萃取所有不重複的學年度並排序
            const yearsSet = new Set();
            rawData.forEach(d => {
                if(d["學年度"]) yearsSet.add(+d["學年度"]);
            });
            years = Array.from(yearsSet).sort((a, b) => a - b);

            // 萃取所有出現的學校名稱
            const schools = Array.from(new Set(rawData.map(d => d["學校名稱"]).filter(Boolean)));
            
            // 將扁平資料轉換為圖表所需的巢狀陣列
            data = schools.map(school => {
                const schoolData = rawData.filter(d => d["學校名稱"] === school);
                const valueMap = new Map(schoolData.map(d => [+d["學年度"], +d["日間生師比"]]));
                
                return {
                    name: school,
                    values: years.map(y => valueMap.get(y) || 0), // 若該年無資料則預設為 0
                    color: colorMap[school] || "#999999" // 若為未來新增的學校，預設為灰色
                };
            });

            // 寫入下拉式選單選項
            const select = d3.select("#uni-select");
            data.forEach(d => {
                select.append("option").attr("value", d.name).text(d.name);
            });

            // 啟動圖表初始化邏輯
            init();
            
        }).catch(function(error) {
            console.error("載入 CSV 發生錯誤:", error);
            d3.select("#bcr-container").html(
                "<p style='color:red; text-align:center; padding-top: 20px;'>" +
                "無法載入 student_teacher_ratio.csv。<br>" +
                "請確保檔案名稱與欄位正確 (需包含：學年度、學校名稱、日間生師比)。<br>" +
                "註：若您是直接點擊開啟 HTML (file:///)，瀏覽器可能會因 CORS 安全政策阻擋讀取，請使用 Local Web Server (如 VS Code 的 Live Server) 開啟網頁。</p>"
            );
        });

        const margin = {top: 20, right: 30, bottom: 40, left: 100};
        
        function getDim(nodeId) {
            const node = document.getElementById(nodeId);
            return {
                w: node.clientWidth,
                h: node.clientHeight,
                width: node.clientWidth - margin.left - margin.right,
                height: node.clientHeight - margin.top - margin.bottom
            };
        }

        // --- 折線圖 (Line Chart) 模組 ---
        let lineSvg, xLine, yLine;
        function drawLineChart() {
            const dim = getDim("line-container");
            d3.select("#line-container").selectAll("*").remove();
            
            lineSvg = d3.select("#line-container").append("svg")
                .attr("width", dim.w)
                .attr("height", dim.h)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            xLine = d3.scaleLinear().domain(d3.extent(years)).range([0, dim.width]);
            
            // 動態計算 Y 軸邊界
            const maxRatio = d3.max(data, d => d3.max(d.values)) || 35;
            const minRatio = d3.min(data, d => d3.min(d.values)) || 10;
            yLine = d3.scaleLinear().domain([Math.max(0, minRatio - 5), maxRatio + 2]).range([dim.height, 0]);

            lineSvg.append("g").attr("transform", `translate(0,${dim.height})`)
                .call(d3.axisBottom(xLine).tickFormat(d3.format("d")).ticks(years.length))
                .attr("class", "axis");
            lineSvg.append("g").call(d3.axisLeft(yLine)).attr("class", "axis");

            const lineGen = d3.line()
                .x((d, i) => xLine(years[i]))
                .y(d => yLine(d));

            data.forEach(d => {
                lineSvg.append("path")
                    .datum(d.values)
                    .attr("class", "line-path")
                    .attr("id", "line-" + d.name.replace(/ /g, ''))
                    .attr("fill", "none")
                    .attr("stroke", d.color)
                    .attr("stroke-width", 2)
                    .attr("d", lineGen);
            });
        }

        function updateLineChart(selected) {
            if (selected === "all") {
                d3.selectAll(".line-path").attr("opacity", 1).attr("stroke-width", 2);
            } else {
                d3.selectAll(".line-path").attr("opacity", 0.1).attr("stroke-width", 1);
                d3.select("#line-" + selected.replace(/ /g, '')).attr("opacity", 1).attr("stroke-width", 4);
            }
        }

        // --- 動態長條圖 (Bar Chart Race) 模組 ---
        let bcrSvg, xBcr, yBcr, yearText, dimBcr;

        function drawBarChartRace() {
            dimBcr = getDim("bcr-container");
            d3.select("#bcr-container").selectAll("*").remove();
            
            bcrSvg = d3.select("#bcr-container").append("svg")
                .attr("width", dimBcr.w)
                .attr("height", dimBcr.h)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            xBcr = d3.scaleLinear().range([0, dimBcr.width]);
            yBcr = d3.scaleBand().range([0, dimBcr.height]).padding(0.1);
            
            yearText = bcrSvg.append("text")
                .attr("class", "year-label")
                .attr("x", dimBcr.width)
                .attr("y", dimBcr.height - 10)
                .text("");
        }

        function updateBarChart(yearIndex) {
            // 提取當年度資料並排序，適應未來可能的資料量增減
            const currentTopN = Math.min(15, data.length); 
            const yearData = data.map(d => ({
                name: d.name,
                value: d.values[yearIndex],
                color: d.color
            })).sort((a, b) => b.value - a.value).slice(0, currentTopN);

            yearData.forEach((d, i) => d.rank = i);

            xBcr.domain([0, d3.max(yearData, d => d.value) + 2]);
            yBcr.domain(d3.range(currentTopN));

            yearText.text(years[yearIndex] + " 學年度");

            const bars = bcrSvg.selectAll(".bar").data(yearData, d => d.name);
            
            bars.enter().append("rect")
                .attr("class", "bar")
                .attr("x", 0)
                .attr("y", dimBcr.height)
                .attr("width", d => xBcr(d.value))
                .attr("height", yBcr.bandwidth())
                .attr("fill", d => d.color)
                .transition().duration(tickDuration)
                .attr("y", d => yBcr(d.rank));

            bars.transition().duration(tickDuration).ease(d3.easeLinear)
                .attr("width", d => xBcr(d.value))
                .attr("y", d => yBcr(d.rank));

            bars.exit().transition().duration(tickDuration)
                .attr("width", 0).attr("y", dimBcr.height).remove();

            const labels = bcrSvg.selectAll(".label").data(yearData, d => d.name);
            
            labels.enter().append("text")
                .attr("class", "label")
                .attr("x", -5)
                .attr("y", dimBcr.height)
                .attr("text-anchor", "end")
                .attr("alignment-baseline", "middle")
                .attr("fill", "#111")
                .attr("font-size", "12px")
                .text(d => d.name)
                .transition().duration(tickDuration)
                .attr("y", d => yBcr(d.rank) + yBcr.bandwidth() / 2);

            labels.transition().duration(tickDuration).ease(d3.easeLinear)
                .attr("y", d => yBcr(d.rank) + yBcr.bandwidth() / 2);
                
            labels.exit().remove();
            
            const values = bcrSvg.selectAll(".value").data(yearData, d => d.name);
            
            values.enter().append("text")
                .attr("class", "value")
                .attr("x", d => xBcr(d.value) + 5)
                .attr("y", dimBcr.height)
                .attr("alignment-baseline", "middle")
                .attr("fill", "#111")
                .attr("font-size", "12px")
                .text(d => d.value.toFixed(2))
                .transition().duration(tickDuration)
                .attr("y", d => yBcr(d.rank) + yBcr.bandwidth() / 2);

            values.transition().duration(tickDuration).ease(d3.easeLinear)
                .attr("x", d => xBcr(d.value) + 5)
                .attr("y", d => yBcr(d.rank) + yBcr.bandwidth() / 2)
                .tween("text", function(d) {
                    const i = d3.interpolateRound(parseFloat(this.textContent), d.value);
                    return function(t) { this.textContent = d.value.toFixed(2); };
                });
                
            values.exit().remove();
        }

        function init() {
            drawLineChart();
            drawBarChartRace();
            
            if(ticker) ticker.stop();
            currentYearIndex = 0;
            updateBarChart(currentYearIndex);
            
            ticker = d3.interval(() => {
                currentYearIndex++;
                if (currentYearIndex >= years.length) {
                    ticker.stop();
                    return;
                }
                updateBarChart(currentYearIndex);
            }, tickDuration);
        }

        // --- 事件監聽器 (Event Listeners) ---
        d3.select("#uni-select").on("change", function() {
            updateLineChart(this.value);
        });

        d3.select("#reset-btn").on("click", () => {
            d3.select("#uni-select").property("value", "all");
            updateLineChart("all");
            init(); // 重置並重新播放動畫
        });

        // 確保視窗縮放時，圖表尺寸能隨之重繪
        window.addEventListener("resize", () => {
            if (data.length === 0) return; // 確保 CSV 資料已成功載入
            drawLineChart();
            updateLineChart(d3.select("#uni-select").property("value"));
            drawBarChartRace();
            updateBarChart(currentYearIndex);
        });

    </script>
</body>
</html>
